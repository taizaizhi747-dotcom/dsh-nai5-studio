name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build bundle artifacts
        run: npm run build

      - name: Verify generated artifacts match committed files
        run: git diff --exit-code client.js cordis.patch.yml

      - name: Run syntax checks
        run: npm run check

      - name: Run test suite
        run: npm test
